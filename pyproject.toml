[project]
name = "vtcsi"
version = "0.1.0"
description = "Bộ sinh bảng báo hiệu PSI/SI cho VTC DVB-S"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

# Lõi thuần không có phụ thuộc ngoài — pyyaml chỉ dùng ở vỏ config.
# Giao diện web là tuỳ chọn: `vtcsi build` và `vtcsi epg`, tức đường ra sóng,
# chạy được khi không cài nhóm `web`. Đó là chủ ý — máy phát không cần web.

# Lenh dong lenh. THIEU MUC NAY thi `pip install` khong tao ra file thuc thi
# nao ca, va moi thu goi `vtcsi` deu chet voi "No such file or directory".
#
# Tren may lap trinh khong ai thay, vi o do luon chay `python -m vtcsi.cli`.
# No chi lo ra o lan trien khai container dau tien, khi Dockerfile goi `vtcsi`
# — va luc do trieu chung la container restart lien tuc, khong phai mot loi
# cai dat. `tests/test_docker.py` canh cho chuyen do khong lap lai.
[project.scripts]
vtcsi = "vtcsi.cli:main"

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vtcsi.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
