# Hai dịch vụ, hai mạng khác nhau — và đó là điểm chính của file này.
#
#   si    phát multicast  → bắt buộc network_mode: host
#   web   nhập liệu       → bridge, để sau proxy của Coolify
#
# Chạy:
#   docker compose up -d web        # nhập liệu, an toàn, không phát gì
#   docker compose up -d si         # PHÁT SÓNG THẬT — xem cảnh báo dưới
#
# Đổi code thì `docker compose build` rồi `up -d si web` — **cả hai**. Cả hai
# cùng sinh bảng XML vào `/build` và ghi đè lên nhau, nên dựng lại mỗi `web` sẽ
# để `si` chạy code cũ mà đọc cấu hình mới: bảng ra có version MỚI mà nội dung
# CŨ. Xem mục "Đổi code thì phải dựng lại cả hai dịch vụ" trong
# `kiem-thu-thuc-te.md`.
#
# Trước khi bật `si` lần đầu, đọc `kiem-thu-thuc-te.md`. Bậc 0 và bậc 1 không
# đụng tới mux và bắt được phần lớn lỗi; đừng nhảy thẳng lên đây.

name: vtcsi

x-common: &common
  build: .
  image: vtcsi:local
  restart: unless-stopped
  environment:
    TZ: Asia/Ho_Chi_Minh
  volumes:
    # CẢ kho git, không phải riêng `config/`.
    #
    # `VTCSI_REPO` mặc định là thư mục hiện tại, đúng cho lúc chạy tay. Dưới
    # **Coolify thì phải đặt nó trỏ ra ngoài**, ví dụ `/srv/vtcsi/repo`:
    # Coolify tự clone kho vào thư mục nó quản lý và `reset --hard` mỗi lần
    # triển khai lại. Mà giao diện thì **commit vào chính kho đó**. Để nguyên
    # mặc định dưới Coolify nghĩa là mỗi lần bấm Redeploy là xoá sạch những gì
    # người trực đã sửa — và xoá lặng lẽ.
    #
    # Giao diện chạy `git diff` và `git commit`; hai lệnh đó cần thư mục `.git`
    # nằm đúng chỗ của nó so với `config/`. Gắn riêng `config/` vào thì sửa vẫn
    # được nhưng mất lịch sử — tức mất luôn cơ chế đồng bộ giữa hai hệ.
    - ${VTCSI_REPO:-.}:/repo:rw
    # Bảng XML sinh ra. Ổ riêng, không phải thư mục dự án: chúng là sản phẩm
    # dựng lại được, và `.gitignore` đã loại chúng khỏi git.
    - vtcsi-build:/build

services:
  si:
    <<: *common
    container_name: vtcsi-si

    # Multicast KHÔNG đi ra đúng cách qua mạng bridge của Docker. Đây không
    # phải chuyện tối ưu — đổi sang bridge là luồng biến mất khỏi mạng.
    network_mode: host

    command:
      - vtcsi
      - --config=/repo/config
      - run
      # KHÔNG truyền `--to` ở đây. Địa chỉ đầu ra đọc từ
      # `config/dau-ra.yaml`, đặt trên trang **Đầu ra** của giao diện (FR-86).
      #
      # Lý do không phải cho gọn: `--to` trên dòng lệnh **tắt luôn đường sao
      # chép**, vì nó là tham số dành cho một lần chạy thử tới đích khác. Ghim
      # nó vào compose nghĩa là dịch vụ chạy thật vĩnh viễn chỉ còn một đường
      # ra, mà giao diện thì vẫn hiện hai — sai lệch không ai thấy cho tới hôm
      # card mạng hỏng.
      - --build=/build
      - --eit-dir=/build/eit
      - --inbox=/repo/epg/inbox
      - --refresh-every=3600

    # KHÔNG đặt CPU quota.
    #
    # Throttling của cgroup chèn khựng vào đúng chỗ cần đều nhịp: mux phát
    # hiện mất nguồn bằng cách đếm gói UDP, nên một khoảng lặng 100 ms do bị
    # bóp CPU có thể bị đọc thành "nguồn chết". Giới hạn bộ nhớ thì vô hại.
    mem_limit: 512m

    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  web:
    <<: *common
    container_name: vtcsi-web
    # Vào cả mạng nội bộ của dự án LẪN mạng 'coolify'. Nhờ mạng 'coolify',
    # container EPG (nhập liệu, do Coolify quản) gọi thẳng được vtcsi-web bằng
    # tên: http://vtcsi-web:8080/api/epg — luồng local, không ra Internet.
    # (si giữ network_mode: host, không đụng.)
    networks:
      - default
      - coolify
    command:
      - vtcsi
      - --config=/repo/config
      - web
      - --host=0.0.0.0
      - --port=8080
      - --repo=/repo
      # Ba dòng này PHẢI trùng với `si` ở trên.
      #
      # Mặc định của `vtcsi web` là đường dẫn **tương đối**, giải theo
      # `WORKDIR /app`. Bỏ trống thì giao diện ghi file lịch vào
      # `/app/epg/inbox` còn `si` đọc `/repo/epg/inbox`: nạp XML qua trình
      # duyệt báo "đã nhận" nhưng **không bao giờ lên sóng**, màn giám sát thì
      # trống trơn. Không có thông báo lỗi nào cả.
      #
      # `tests/test_docker.py` canh cho ba dòng này khớp với `si`.
      - --build=/build
      - --eit-dir=/build/eit
      - --inbox=/repo/epg/inbox
    # Mat khau KHONG dat qua trinh duyet. Lan dau, vao container ma dat:
    #   docker compose exec web vtcsi --config=/repo/config passwd --repo=/repo
    # Cho toi luc do, giao dien chi hien huong dan va khong phuc vu gi khac.
    ports:
      # Cong PHIA MAY dat duoc tu ngoai, vi may thuc te thuong da co thu khac
      # chiem 8080 — Coolify va cac dich vu no quan la truong hop dien hinh.
      # Cong ben trong container giu nguyen 8080, khong can doi.
      #
      #   VTCSI_PORT=8090 docker compose up -d web
      #
      # Dat trong .env canh docker-compose.yml thi khoi go lai moi lan.
      - "${VTCSI_PORT:-8080}:8080"
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  # Mạng nội bộ mặc định của dự án (vtcsi_default) — giữ nguyên như cũ.
  default:
  # Mạng của Coolify, đã tạo sẵn. external = dùng lại, compose không tự tạo.
  # Cho vtcsi-web nối vào để container EPG bên Coolify gọi được bằng tên.
  coolify:
    external: true

volumes:
  vtcsi-build:
